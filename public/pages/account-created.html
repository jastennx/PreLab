<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Account Confirmed</title>
  <link rel="icon" type="image/svg+xml" href="/assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./account-created.css" />
</head>
<body>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <main class="page">
    <section class="card">
      <img src="/assets/prelab-logo.png" alt="PreLab logo" class="logo" />
      <div class="check-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h1>Account Verified</h1>
      <p id="message">Your email was confirmed successfully. You can now sign in to PreLab.</p>
      <a id="go-signin-link" class="btn-primary" href="/pages/signin?mode=signin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Go to Sign In
      </a>
    </section>
  </main>
  <script src="../js/account-created.js"></script>
</body>
</html>
