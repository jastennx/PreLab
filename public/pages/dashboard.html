<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./dashboard.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <!-- Decorative background orbs -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </div>
    <div class="userbox">
      <div class="user-avatar" id="user-avatar">U</div>
      <span id="user-email">user@email.com</span>
      <a href="/pages/settings" class="topbar-link" title="Settings">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
      <button id="logout-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </header>

  <main class="page-shell">

    <!-- Hero welcome -->
    <section class="hero-welcome" data-reveal="fade-up">
      <div class="hero-welcome-inner">
        <p class="badge" data-reveal="fade-up" data-delay="1"><span class="badge-dot"></span> Dashboard</p>
        <h1 id="welcome-title" data-reveal="fade-up" data-delay="2">Welcome Back, User!</h1>
        <p class="subtitle" data-reveal="fade-up" data-delay="3">Upload your study material and create interactive mock exams, quizzes, and activities.</p>
      </div>
    </section>

    <!-- Create module -->
    <section class="create-card" data-reveal="fade-up">
      <div class="card-header">
        <div class="card-header-icon">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div>
          <h2>Create New Module</h2>
          <p class="card-header-sub">Add your study material to generate quizzes and explanations</p>
        </div>
      </div>

      <form id="module-form" class="create-form">
        <!-- Row 1: meta inputs -->
        <div class="form-row form-row--meta">
          <div class="field">
            <label for="subject-name">File name</label>
            <input id="subject-name" type="text" required placeholder="e.g. Web Development" />
          </div>
          <div class="field">
            <label for="module-title">Activity title</label>
            <input id="module-title" type="text" required placeholder="e.g. Module 1" />
          </div>
          <div class="field">
            <label for="study-goal">Goal <span class="opt">(optional)</span></label>
            <input id="study-goal" type="text" placeholder="e.g. Prepare for midterm" />
          </div>
        </div>

        <!-- Row 2: visibility -->
        <div class="form-row form-row--visibility">
          <div class="visibility-toggle">
            <label class="toggle-label">Visibility</label>
            <div class="toggle-switch-row">
              <button type="button" id="vis-private-btn" class="vis-btn vis-btn--active" data-vis="private">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Private
              </button>
              <button type="button" id="vis-public-btn" class="vis-btn" data-vis="public">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Public
              </button>
            </div>
            <p class="vis-hint" id="vis-hint">Only you can see this module.</p>
          </div>
          <div class="field field--category" id="category-field" style="display:none">
            <label for="module-category">Category</label>
            <select id="module-category">
              <option value="">Select a category...</option>
            </select>
          </div>
        </div>

        <!-- Row 3: material -->
        <div class="form-row form-row--material">
          <label for="material-file" class="upload-zone">
            <div class="upload-icon-ring">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <strong>Upload PDF or DOCX</strong>
            <span class="upload-hint">Drag & drop or click to browse</span>
            <span id="file-indicator" class="file-indicator">No file selected</span>
          </label>
          <input id="material-file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />

          <div class="material-divider"><span>or</span></div>

          <div class="field field--paste">
            <label for="material-text">Paste study material</label>
            <textarea id="material-text" rows="5" placeholder="Paste notes, lecture text, or key concepts..."></textarea>
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button id="create-module-btn" class="btn-primary" type="submit">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Create Module
          </button>
          <p id="module-message" class="msg"></p>
        </div>
      </form>
    </section>

    <!-- Module list -->
    <section class="modules-section" data-reveal="fade-up">
      <div class="section-head">
        <div class="section-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <h2>Your Modules</h2>
      </div>
      <div id="module-list" class="module-grid"></div>
    </section>

    <!-- Community Reviewers -->
    <section class="community-section" data-reveal="fade-up">
      <div class="section-head">
        <div class="section-icon section-icon--community">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <h2>Community Reviewers</h2>
      </div>
      <div class="community-tabs" id="community-tabs">
        <button class="comm-tab comm-tab--active" data-category="">All</button>
      </div>
      <div id="community-list" class="module-grid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/coolalertjs@1.0.3/dist/coolalert.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
