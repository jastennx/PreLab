<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./dashboard.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </div>
    <div class="userbox">
      <div class="user-avatar" id="user-avatar">U</div>
      <span id="user-email">user@email.com</span>
      <button id="logout-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <!-- Welcome strip -->
  <div class="welcome-banner">
    <div class="welcome-inner">
      <h1 id="welcome-title">Welcome Back, User!</h1>
      <p class="subtitle">Upload your study material and create interactive mock exams, quizzes, and activities.</p>
    </div>
  </div>

  <main class="page-content">

    <!-- Create module — compact horizontal form -->
    <section class="create-section">
      <div class="section-head">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <h2>Create New Module</h2>
      </div>

      <form id="module-form" class="create-form">
        <div class="form-row">
          <div class="field">
            <label for="subject-name">Subject</label>
            <input id="subject-name" type="text" required placeholder="e.g. Web Development" />
          </div>
          <div class="field">
            <label for="module-title">Module title</label>
            <input id="module-title" type="text" required placeholder="e.g. Module 1" />
          </div>
          <div class="field">
            <label for="study-goal">Goal <span class="opt">(optional)</span></label>
            <input id="study-goal" type="text" placeholder="e.g. Prepare for midterm" />
          </div>
        </div>

        <div class="form-row form-row--material">
          <div class="field field--upload">
            <label for="material-file" class="upload-zone">
              <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <strong>Upload PDF or DOCX</strong>
              <span id="file-indicator" class="file-indicator">No file selected</span>
            </label>
            <input id="material-file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
          </div>
          <div class="field field--paste">
            <label for="material-text">Or paste study material</label>
            <textarea id="material-text" rows="4" placeholder="Paste notes, lecture text, or key concepts..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button id="create-module-btn" class="btn-primary" type="submit">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Module
          </button>
          <p id="module-message" class="msg"></p>
        </div>
      </form>
    </section>

    <!-- Module card grid -->
    <section class="modules-section">
      <div class="section-head">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <h2>Your Modules</h2>
      </div>
      <div id="module-list" class="module-grid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
