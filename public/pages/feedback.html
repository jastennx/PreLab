<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Feedback</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./feedback.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <!-- Decorative background orbs -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </div>
    <div class="actions">
      <a href="/pages/dashboard" class="topbar-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/pages/settings" class="topbar-link" title="Settings">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
      <button id="logout-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <!-- Score hero section -->
  <section class="score-hero" data-reveal="fade-up">
    <div class="hero-inner">
      <h1 id="result-title" class="hero-title" data-reveal="fade-up" data-delay="1">Quiz Results</h1>
      <div class="score-ring" data-reveal="scale-in" data-delay="2">
        <svg class="score-svg" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="score-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#22d3ee" />
            </linearGradient>
          </defs>
          <circle class="score-track" cx="60" cy="60" r="52" />
          <circle id="score-arc" class="score-arc" cx="60" cy="60" r="52" />
        </svg>
        <span id="score" class="score-value">-</span>
      </div>
      <p class="correct-label" data-reveal="fade-up" data-delay="3">Correct: <strong id="correct">-/-</strong></p>
      <p id="encouragement" class="encouragement" data-reveal="fade-up" data-delay="4">Great effort! Review your answers below.</p>
    </div>
  </section>

  <main class="results-content">

    <!-- LEFT — Answer review list -->
    <section class="review-panel" data-reveal="fade-up">
      <div class="panel-head">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <h2>Answer Review</h2>
      </div>
      <div id="review-list" class="review-list"></div>
    </section>

    <!-- RIGHT — Tips + actions -->
    <aside class="tips-panel" data-reveal="fade-up" data-delay="1">
      <div class="tips-card">
        <div class="panel-head">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <h2>Next Steps</h2>
        </div>
        <ul id="tips-list" class="tips-list"></ul>
      </div>

      <div class="action-card">
        <a id="retry-study-link" href="/pages/study" class="btn-primary btn-full">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Back to Study
        </a>
        <a href="/pages/dashboard" class="btn-secondary btn-full">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Go to Dashboard
        </a>
      </div>
    </aside>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/coolalertjs@1.0.3/dist/coolalert.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/feedback.js"></script>
</body>
</html>
