<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Practice</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./practice.css" />
</head>
<body>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </div>
    <div class="actions">
      <a href="/pages/dashboard">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <button id="logout-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <main class="container">
    <section class="status-card">
      <div class="status-top">
        <h1 id="module-title">Module Quiz</h1>
        <span class="question-counter">Question <span id="current-number">1</span> of <span id="total-number">1</span></span>
      </div>
      <div class="progress"><span id="progress-fill"></span></div>
    </section>

    <section class="question-card">
      <h2 id="question-text">Loading question...</h2>
      <div id="option-list" class="option-list"></div>
      <div class="question-footer">
        <button id="next-btn">Next</button>
        <p id="submit-status" class="submit-status" aria-live="polite"></p>
      </div>

      <div class="pager-section">
        <h3>Questions</h3>
        <div id="pager" class="pager"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/practice.js"></script>
</body>
</html>
