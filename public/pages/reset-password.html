<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="/assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./reset-password.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <header class="topbar">
    <a class="brand" href="/pages/home">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </a>
  </header>

  <main class="reset-page">
    <section class="reset-card">
      <a class="back-link" href="/pages/signin?mode=signin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to sign in
      </a>

      <div class="reset-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Reset Password</h1>
      <p id="reset-message" class="reset-message">Enter your new password below.</p>

      <form id="reset-form">
        <div class="input-wrap">
          <label for="new-password">New password</label>
          <div class="input-field">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="new-password" type="password" minlength="6" required placeholder="At least 6 characters" />
          </div>
        </div>

        <div class="input-wrap">
          <label for="confirm-new-password">Confirm new password</label>
          <div class="input-field">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <input id="confirm-new-password" type="password" minlength="6" required placeholder="Re-enter your new password" />
          </div>
        </div>

        <button id="reset-submit" class="btn-submit" type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Update Password
        </button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
