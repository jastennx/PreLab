<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Reset Password</title>
  <link rel="icon" type="image/png" href="/assets/prelab-logo.png" />
  <link rel="stylesheet" href="./reset-password.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/pages/home">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </a>
  </header>

  <main class="reset-page">
    <section class="reset-card">
      <a class="back-link" href="/pages/signin?mode=signin">&larr; Back to sign in</a>
      <h1>Reset Password</h1>
      <p id="reset-message" class="reset-message">Enter your new password below.</p>

      <form id="reset-form">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="6" required placeholder="At least 6 characters" />

        <label for="confirm-new-password">Confirm new password</label>
        <input
          id="confirm-new-password"
          type="password"
          minlength="6"
          required
          placeholder="Re-enter your new password"
        />

        <button id="reset-submit" class="btn dark" type="submit">Update Password</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
