<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Sign In</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./signin.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <header class="topbar">
    <a class="brand" href="/pages/home">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <a class="back-link" href="/pages/home">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
      <h2 id="auth-title">Sign in</h2>
      <p class="auth-subtitle">Welcome back to your learning journey.</p>

      <form id="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
            <input id="email" type="email" required placeholder="you@example.com" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="3"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" type="password" minlength="6" required placeholder="At least 6 characters" />
          </div>
          <p id="forgot-password-wrap" class="forgot-wrap">
            <button id="forgot-password-btn" class="inline-btn" type="button">Forgot password?</button>
          </p>
        </div>

        <div class="form-group">
          <label id="confirm-password-label" for="confirm-password" class="hidden">Confirm password</label>
          <div class="input-wrap hidden" id="confirm-password-wrap">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="3"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="confirm-password" type="password" minlength="6" placeholder="Re-enter password" />
          </div>
        </div>

        <label id="show-password-wrap" class="show-password hidden" for="show-password">
          <input id="show-password" type="checkbox" />
          Show password
        </label>

        <div class="form-group">
          <label id="full-name-label" for="full-name" class="hidden">Full name</label>
          <div class="input-wrap hidden" id="full-name-wrap">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="full-name" type="text" placeholder="Your name" />
          </div>
        </div>

        <button id="auth-submit" type="submit" class="btn-submit">Sign in</button>
      </form>

      <p id="auth-error" class="error"></p>
      <p id="auth-info" class="info"></p>

      <div class="divider"><span>or</span></div>

      <button id="google-signin" type="button" class="btn-oauth btn-google">
        <svg class="oauth-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="switch-text"><span id="switch-label">Need an account?</span> <button id="switch-mode" class="inline-btn" type="button">Sign up</button></p>
    </section>
  </main>

  <div id="signup-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="signup-modal-title">
      <div class="modal-icon">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
      </div>
      <h3 id="signup-modal-title">Confirm your email</h3>
      <p>
        Your account was created. Please check your email and click the confirmation link before signing in.
      </p>
      <button id="signup-modal-close" type="button" class="btn-submit">Got it</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/coolalertjs@1.0.3/dist/coolalert.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/signin.js"></script>
</body>
</html>
