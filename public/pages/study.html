<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreLab | Study</title>
  <link rel="icon" type="image/svg+xml" href="../assets/prelab-mark.svg" />
  <link rel="stylesheet" href="./study.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/prelab-logo.png" alt="PreLab logo" />
    </div>
    <div class="actions">
      <a href="/pages/dashboard">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <button id="logout-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="study-panel">
      <header class="study-head">
        <div class="study-head-text">
          <h1 id="module-title">Module</h1>
          <p id="subject-name"></p>
          <p class="chat-subtitle">Review, ask, and generate practice in one focused workspace.</p>
        </div>
      </header>

      <div class="quiz-guidance-wrap">
        <label for="quiz-guidance">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          AI Quiz Modifications
        </label>
        <textarea
          id="quiz-guidance"
          maxlength="600"
          placeholder="Example: Scenario-based questions, medium difficulty, focus on authentication and API security."
        ></textarea>
      </div>

      <section class="action-block">
        <div class="controls">
          <button id="generate-explanation" class="btn-action btn-action--secondary">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Generate Explanation
          </button>
          <select id="question-count" aria-label="Question count">
            <option value="10">10 Questions</option>
            <option value="20">20 Questions</option>
            <option value="30">30 Questions</option>
            <option value="40">40 Questions</option>
            <option value="50">50 Questions</option>
          </select>
          <button id="start-practice" class="btn-action btn-action--primary">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Generate Practice Quiz
          </button>
        </div>
        <p id="explanation-status" class="quiz-status" aria-live="polite"></p>
        <p id="quiz-status" class="quiz-status" aria-live="polite"></p>
      </section>

      <article class="explanation-card compact" id="explanation-card">
        <h2>
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          AI Study Explanation
        </h2>
        <p id="explanation-hint" class="explanation-hint">Generate explanation first to view Summary, Key Points, and Study Tips.</p>
        <p id="summary"></p>
        <h3>Key Points</h3>
        <ul id="key-points"></ul>
        <h3>Study Tips</h3>
        <ul id="study-tips"></ul>
      </article>
    </section>

    <aside class="chat-panel">
      <header class="chat-head">
        <div class="chat-avatar">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div>
          <h2>PreLab Assistant</h2>
          <p class="chat-subtitle">Ask anything about this module</p>
        </div>
      </header>
      <div id="chat-messages" class="chat-messages"></div>
      <p id="chat-status" class="chat-status" aria-live="polite"></p>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about this module..." required />
        <button type="submit">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/study.js"></script>
</body>
</html>
